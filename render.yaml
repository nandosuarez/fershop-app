databases:
  - name: fershop-postgres
    plan: basic-256mb
    databaseName: fershop_app

services:
  - type: web
    name: fershop-app
    runtime: node
    plan: starter
    rootDir: fershop-v2
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    preDeployCommand: pnpm db:setup:render
    startCommand: pnpm start:render
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: America/Bogota
      - key: DATABASE_URL
        fromDatabase:
          name: fershop-postgres
          property: connectionString
      - key: POSTGRES_SSL
        value: "false"
      - key: POSTGRES_POOL_MAX
        value: "10"
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_SECURE
        value: "true"
      - key: ADMIN_NAME
        value: Administrador FerShop
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        value: admin@fershop.co
      - key: ADMIN_PASSWORD
        sync: false
